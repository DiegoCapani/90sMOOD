<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEMORY90</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

   <style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
}

/* #splash-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center,
        #6a00ff 0%,
        #1a0033 30%,
        #000000 70%
    );
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.5s ease; 
    }  */

#splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    height: 100dvh; /* FIX mobile moderno */
    background: radial-gradient(circle at center,
        #6a00ff 0%,
        #1a0033 40%,
        #000000 80%
    );
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

    /* CRT EFFECT */
    #splash-screen::before {
        content: " ";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            rgba(18, 16, 16, 0) 50%,
            rgba(0, 0, 0, 0.25) 50%
        ),
        linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.06),
            rgba(0, 255, 0, 0.02),
            rgba(0, 0, 255, 0.06)
        );
        background-size: 100% 4px, 6px 100%;
        pointer-events: none;
    }

    .title-container {
        text-align: center;
        margin-bottom: 50px;
        transform: skewX(-10deg);
    }

    .title-main {
        font-size: 48px;
        font-weight: 900;
        color: #00ffff;
        letter-spacing: 4px;
        text-shadow: 3px 3px 0px #ff00ff, 6px 6px 0px #000;
        margin: 0;
    }

    .title-sub {
        font-size: 18px;
        color: #ffff00;
        margin-top: 10px;
        text-shadow: 2px 2px 0px #ff0000;
    }

    #start-btn {
        padding: 15px 40px;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        background: #00ff00;
        border: 4px solid #fff;
        box-shadow: 5px 5px 0px #ff00ff;
        cursor: pointer;
        text-transform: uppercase;
    }

    #start-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 1px 1px 0px #ff00ff;
    }

    .loading-text {
        color: #fff;
        margin-top: 30px;
        font-size: 12px;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
</style>



 
<script>
AFRAME.registerComponent('center-model', {
    init: function () {
        this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            const box = new THREE.Box3().setFromObject(mesh);
            const center = box.getCenter(new THREE.Vector3());

            mesh.position.x -= center.x;
            mesh.position.y -= center.y;
            mesh.position.z -= center.z;
        });
    }
});
</script>


  
</head>
<body>

<div id="splash-screen">
    <div class="title-container">
        <h1 class="title-main">MEMORY90</h1>
        <div class="title-sub">by Diego Capani</div>
    </div>
    <button id="start-btn">REMEMBER NOW!</button>
    <div class="loading-text">INSERT COIN TO PLAY...</div>
</div>

<a-scene embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

    <a-assets>
        <a-asset-item id="modello-1" src="assets/nokia3310.glb"></a-asset-item>
        <a-asset-item id="modello-2" src="assets/tamagotchi.glb"></a-asset-item>
        <a-asset-item id="modello-3" src="assets/discman.glb"></a-asset-item>
        <a-asset-item id="modello-4" src="assets/kodak400.glb"></a-asset-item>
        <a-asset-item id="modello-5" src="assets/nokia3310.glb"></a-asset-item>

        <audio id="music-marker1" src="assets/nokia.mp3" preload="auto"></audio>
        <audio id="music-marker2" src="assets/tamagotchi.mp3" preload="auto"></audio>
        <audio id="music-marker3" src="assets/hit1.mp3" preload="auto"></audio>
        <audio id="music-marker4" src="assets/hit1.mp3" preload="auto"></audio>
        <audio id="music-marker5" src="assets/hit1.mp3" preload="auto"></audio>
    </a-assets>

     <a-marker id="marker1" type="barcode" value="1">
        <a-entity gltf-model="#modello-1" scale="0.01 0.01 0.01" center-model></a-entity>

        <a-plane rotation="-90 0 0" width="4" height="4" position="0 0 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
    </a-marker>

   <a-marker id="marker2" type="barcode" value="2">
        <a-entity gltf-model="#modello-2" scale="3 3 3" center-model></a-entity>

           <a-plane rotation="-90 0 0" width="4" height="4" position="0 -0.7 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
    </a-marker>

    <a-marker id="marker3" type="barcode" value="3">
        <a-entity gltf-model="#modello-3" scale="0.1 0.1 0.1" center-model>
        </a-entity>

                <a-plane rotation="-90 0 0" width="8" height="8" position="0 0 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
        
    </a-marker>

   <a-marker id="marker4" type="barcode" value="4">
        <a-entity gltf-model="#modello-4" scale="0.5 0.5 0.5"  center-model></a-entity>

        <a-plane rotation="-90 0 0" width="4" height="4" position="0 -0.8 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
    </a-marker>

     <a-marker id="marker5" type="barcode" value="5" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2"> 
        <a-entity gltf-model="#modello-5" scale="3 3 3" position="0 0 -0.2" rotation="90 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        </a-entity>

                <a-plane rotation="-90 0 0" width="4" height="4" position="0 0 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
        
    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const startBtn = document.getElementById('start-btn');
    const splash = document.getElementById('splash-screen');
    const scene = document.querySelector('a-scene');

    const marker1 = document.getElementById('marker1');
    const marker2 = document.getElementById('marker2');
    const marker3 = document.getElementById('marker3');
    const marker4 = document.getElementById('marker4');
    const marker5 = document.getElementById('marker5');

    const music1 = document.getElementById('music-marker1');
    const music2 = document.getElementById('music-marker2');
    const music3 = document.getElementById('music-marker3');
    const music4 = document.getElementById('music-marker4');
    const music5 = document.getElementById('music-marker5');

    // START BUTTON
    startBtn.addEventListener('click', async () => {

        scene.play();

        // 🔓 AUDIO UNLOCK (fondamentale)
        const unlock = [music1, music2, music3, music4, music5];

        for (let m of unlock) {
            try {
                await m.play();
                m.pause();
                m.currentTime = 0;
            } catch (e) {}
        }

        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 500);
    });

    function bind(marker, music, volume = 0.5) {

        marker.addEventListener('markerFound', () => {
            music.volume = volume;
            music.currentTime = 0;
            music.play();
        });

        marker.addEventListener('markerLost', () => {
            music.pause();
            music.currentTime = 0;
        });
    }

    bind(marker1, music1, 0.5);
    bind(marker2, music2, 0.5);
    bind(marker3, music3, 0.5);
    bind(marker4, music4, 0.5);
    bind(marker5, music5, 0.5);

});
</script>

</body>
</html>
