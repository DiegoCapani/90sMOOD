<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEMORY90</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }

        /* ================= STILE SPLASH SCREEN ANNI '90 ================= */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.5s ease;
        }

        #splash-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .title-container {
            text-align: center;
            margin-bottom: 50px;
            transform: skewX(-10deg);
        }

        .title-main {
            font-size: 48px;
            font-weight: 900;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 3px 3px 0px #ff00ff, 6px 6px 0px #000000;
            margin: 0;
        }

        .title-sub {
            font-size: 18px;
            color: #ffff00;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            text-shadow: 2px 2px 0px #ff0000;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 22px;
            font-family: monospace;
            font-weight: bold;
            color: #ffffff;
            background: #00ff00;
            border: 4px solid #ffffff;
            box-shadow: 5px 5px 0px #ff00ff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 3;
            outline: none;
        }

        #start-btn:active {
            box-shadow: 1px 1px 0px #ff00ff;
            transform: translate(4px, 4px);
        }

        .loading-text {
            color: #ffffff;
            margin-top: 30px;
            font-size: 12px;
            letter-spacing: 1px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="title-container">
        <h1 class="title-main">CYBER AR</h1>
        <div class="title-sub">REALITY ENGINE v1.0</div>
    </div>
    <button id="start-btn">START APP</button>
    <div class="loading-text">INSERT MARKER TO PLAY...</div>
</div>

<a-scene embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

    <a-assets>
        <a-asset-item id="modello-1" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-2" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-3" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-4" src="assets/nokia8.glb"></a-asset-item>
    </a-assets>

    <a-marker type="barcode" value="1">
        <a-entity gltf-model="#modello-1" scale="3 3 3" position="0 0 0" rotation="0 90 0"></a-entity>
    </a-marker>

    <a-marker type="barcode" value="2">
        <a-entity gltf-model="#modello-2" scale="3 3 3" position="0 0 0" rotation="0 90 0"></a-entity>
    </a-marker>

    <a-marker type="barcode" value="3">
        <a-entity gltf-model="#modello-3" scale="3 3 3" position="0 0 0" rotation="90 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        </a-entity>
    </a-marker>

    <a-marker type="barcode" value="4" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity gltf-model="#modello-4" scale="0.01 0.01 0.01" position="1 0 -1" rotation="-90 0 0"></a-entity>

        <a-plane rotation="-90 0 0" width="8" height="8" position="0 0 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>
    document.getElementById('start-btn').addEventListener('click', async function () {
        const splash = document.getElementById('splash-screen');
        const scene = document.querySelector('a-scene');

        // 🔥 FIX CAMERA START
        if (scene) scene.play();

        splash.style.opacity = '0';

        setTimeout(() => {
            splash.style.display = 'none';
        }, 500);
    });
</script>

</body>
</html>
