<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>90sMOOD</title>

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family: monospace;
}

/* FOOTER */
#footer-ui{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:9998;
}

#footer-ui button{
    background:#000;
    color:#00ffff;
    border:2px solid #00ffff;
    padding:12px 16px;
    font-weight:bold;
}

/* INFO */
#info-panel{
    position:fixed;
    left:20px;
    right:20px;
    bottom:90px;
    background:rgba(0,0,0,.85);
    color:#fff;
    padding:20px;
    border:2px solid #00ffff;
    display:none;
    z-index:9998;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash-screen">
    <h1>90sMOOD</h1>
    <button id="start-btn">REMEMBER NOW!</button>
</div>

<!-- FOOTER -->
<div id="footer-ui">
    <button id="info-btn">INFO</button>
    <button id="photo-btn">📸</button>
    <button id="rotate-btn">⟳</button>
</div>

<div id="info-panel">
    <h2 id="object-name"></h2>
    <p id="object-description"></p>
</div>

<!-- SCENE -->
<a-scene embedded vr-mode-ui="enabled:false"
    renderer="antialias:true; alpha:true"
    arjs="sourceType:webcam; detectionMode:mono_and_matrix; matrixCodeType:3x3; debugUIEnabled:false;">

<a-assets>
    <a-asset-item id="modello-1" src="assets/nokia3310.glb"></a-asset-item>
    <a-asset-item id="modello-2" src="assets/tamagotchi.glb"></a-asset-item>
    <a-asset-item id="modello-3" src="assets/discman.glb"></a-asset-item>
</a-assets>

<a-marker type="barcode" value="1">
    <a-entity gltf-model="#modello-1" id="obj1"></a-entity>
</a-marker>

<a-marker type="barcode" value="2">
    <a-entity gltf-model="#modello-2" id="obj2"></a-entity>
</a-marker>

<a-marker type="barcode" value="3">
    <a-entity gltf-model="#modello-3" id="obj3"></a-entity>
</a-marker>

<a-entity camera></a-entity>
</a-scene>

<script>
document.addEventListener('DOMContentLoaded', () => {

let currentObject = null;
let infoVisible = false;
let rotationEnabled = false;

const splash = document.getElementById('splash-screen');
const startBtn = document.getElementById('start-btn');
const scene = document.querySelector('a-scene');

startBtn?.addEventListener('click', () => {
    scene?.play();
    splash.style.opacity = '0';
    setTimeout(()=> splash.style.display='none', 500);
});

/* MARKER TRACKING */
document.querySelectorAll('a-marker').forEach(marker=>{
    marker.addEventListener('markerFound', ()=>{
        currentObject = marker.querySelector('a-entity');
        updateInfo(marker);
    });

    marker.addEventListener('markerLost', ()=>{
        currentObject = null;
    });
});

/* INFO */
const infoBtn = document.getElementById('info-btn');
const infoPanel = document.getElementById('info-panel');

infoBtn?.addEventListener('click', ()=>{
    infoVisible = !infoVisible;
    infoPanel.style.display = infoVisible ? 'block' : 'none';
});

/* DESCRIZIONI */
const descriptions = {
    1:{ name:"Nokia 3310", description:"Telefono indistruttibile anni 2000." },
    2:{ name:"Tamagotchi", description:"Il tuo amico digitale da accudire." },
    3:{ name:"Discman", description:"Musica portatile prima dello streaming." }
};

function updateInfo(marker){
    if(!infoVisible) return;
    const value = marker.getAttribute('value');
    const data = descriptions[value];
    if(!data) return;

    document.getElementById('object-name').textContent = data.name;
    document.getElementById('object-description').textContent = data.description;
}

/* ROTATE */
document.getElementById('rotate-btn')?.addEventListener('click', ()=>{
    if(!currentObject) return;

    rotationEnabled = !rotationEnabled;

    if(rotationEnabled){
        currentObject.setAttribute('animation',
            'property: rotation; to: 0 360 0; loop:true; dur:8000');
    } else {
        currentObject.removeAttribute('animation');
    }
});

/* FOTO */
document.getElementById('photo-btn')?.addEventListener('click', ()=>{
    const video = document.querySelector('video');
    if(!video) return;

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video,0,0);

    const link = document.createElement('a');
    link.download = '90sMOOD.png';
    link.href = canvas.toDataURL();
    link.click();
});

});
</script>

</body>
</html>
