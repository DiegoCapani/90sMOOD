<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEMORY90</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

   <style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: monospace;
}

/* #splash-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center,
        #6a00ff 0%,
        #1a0033 30%,
        #000000 70%
    );
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.5s ease; 
    }  */

#splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    height: 100dvh; /* FIX mobile moderno */
    background: radial-gradient(circle at center,
        #6a00ff 0%,
        #1a0033 40%,
        #000000 80%
    );
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

    /* CRT EFFECT */
    #splash-screen::before {
        content: " ";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            rgba(18, 16, 16, 0) 50%,
            rgba(0, 0, 0, 0.25) 50%
        ),
        linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.06),
            rgba(0, 255, 0, 0.02),
            rgba(0, 0, 255, 0.06)
        );
        background-size: 100% 4px, 6px 100%;
        pointer-events: none;
    }

    .title-container {
        text-align: center;
        margin-bottom: 50px;
        transform: skewX(-10deg);
    }

    .title-main {
        font-size: 48px;
        font-weight: 900;
        color: #00ffff;
        letter-spacing: 4px;
        text-shadow: 3px 3px 0px #ff00ff, 6px 6px 0px #000;
        margin: 0;
    }

    .title-sub {
        font-size: 18px;
        color: #ffff00;
        margin-top: 10px;
        text-shadow: 2px 2px 0px #ff0000;
    }

    #start-btn {
        padding: 15px 40px;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        background: #00ff00;
        border: 4px solid #fff;
        box-shadow: 5px 5px 0px #ff00ff;
        cursor: pointer;
        text-transform: uppercase;
    }

    #start-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 1px 1px 0px #ff00ff;
    }

    .loading-text {
        color: #fff;
        margin-top: 30px;
        font-size: 12px;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
</style>
</head>
<body>

<div id="splash-screen">
    <div class="title-container">
        <h1 class="title-main">MEMORY90</h1>
        <div class="title-sub">by Diego Capani</div>
    </div>
    <button id="start-btn">REMEMBER NOW!</button>
    <div class="loading-text">INSERT COIN TO PLAY...</div>
</div>

<a-scene embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

    <a-assets>
        <a-asset-item id="modello-1" src="assets/nokia3310.glb"></a-asset-item>
        <a-asset-item id="modello-2" src="assets/tamagotchi.glb"></a-asset-item>
        <a-asset-item id="modello-3" src="assets/discman.glb"></a-asset-item>
        <a-asset-item id="modello-4" src="assets/kodak400.glb"></a-asset-item>
        <a-asset-item id="modello-5" src="assets/nokia3310.glb"></a-asset-item>

        <audio id="music-marker1" src="assets/nokia.mp3" preload="auto"></audio>
        <audio id="music-marker2" src="assets/tamagotchi.mp3" preload="auto"></audio>
        <audio id="music-marker3" src="assets/hit1.mp3" preload="auto"></audio>
        <audio id="music-marker4" src="assets/hit1.mp3" preload="auto"></audio>
        <audio id="music-marker5" src="assets/hit1.mp3" preload="auto"></audio>
    </a-assets>

     <a-marker id="marker1" type="barcode" value="1" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity gltf-model="#modello-1" scale="0.01 0.01 0.01" position="0 0 -0.2" rotation="0 0 0"></a-entity>

        <a-plane rotation="-90 0 0" width="4" height="4" position="0 0 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
    </a-marker>

   <a-marker id="marker2" type="barcode" value="2" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="2">>
        <a-entity gltf-model="#modello-2" scale="3 3 3" position="0 0 -0.2" rotation="0 0 0"></a-entity>

           <a-plane rotation="-90 0 0" width="4" height="4" position="0 -0.7 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
    </a-marker>

    <a-marker id="marker3" type="barcode" value="3" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="2">>
        <a-entity gltf-model="#modello-3" scale="0.1 0.1 0.1" position="0 -0.2 -0.2" rotation="0 0 0">
        </a-entity>

                <a-plane rotation="-90 0 0" width="8" height="8" position="0 0 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
        
    </a-marker>

   <a-marker id="marker4" type="barcode" value="4" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="2">>
        <a-entity gltf-model="#modello-4" scale="0.5 0.5 0.5" position="0 0 -0.2" rotation="0 0 0"></a-entity>

        <a-plane rotation="-90 0 0" width="4" height="4" position="0 -0.8 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
    </a-marker>

     <a-marker id="marker5" type="barcode" value="5" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity gltf-model="#modello-5" scale="3 3 3" position="0 0 -0.2" rotation="90 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        </a-entity>

                <a-plane rotation="-90 0 0" width="4" height="4" position="0 0 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
        
    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const startBtn = document.getElementById('start-btn');
    const splash = document.getElementById('splash-screen');
    const scene = document.querySelector('a-scene');

    // MARKER 1
    const marker1 = document.getElementById('marker1');
    const music1 = document.getElementById('music-marker1');

    // MARKER 2
    const marker2 = document.getElementById('marker2');
    const music2 = document.getElementById('music-marker2');

    // MARKER 3
    const marker3 = document.getElementById('marker3');
    const music3 = document.getElementById('music-marker3');

    // MARKER 4
    const marker4 = document.getElementById('marker4');
    const music4 = document.getElementById('music-marker4');

    // MARKER 5
    const marker5 = document.getElementById('marker5');
    const music5 = document.getElementById('music-marker5');

   startBtn.addEventListener('click', () => {

    scene.play();

    // 🔓 UNLOCK AUDIO (VA QUI)
    [music1, music2, music3, music4, music5].forEach(m => {
        m.play().then(() => {
            m.pause();
            m.currentTime = 0;
        }).catch(()=>{});
    });

    splash.style.opacity = '0';

    setTimeout(() => splash.style.display = 'none', 500);
});

        // ===== MARKER 1 =====
    marker1.addEventListener('markerFound', () => {
        music1.currentTime = 0;
        music1.play();
    });

        marker1.addEventListener('markerLost', () => {
        music1.pause();
        music1.currentTime = 0;
    });

    // ===== MARKER 2 =====
    marker2.addEventListener('markerFound', () => {
        music2.currentTime = 0;
        music2.play();
    });

            marker2.addEventListener('markerLost', () => {
        music2.pause();
        music2.currentTime = 0;
    });

    // ===== MARKER 3 =====
    marker3.addEventListener('markerFound', () => {
        music3.currentTime = 0;
        music3.play();
    });

    marker3.addEventListener('markerLost', () => {
        music3.pause();
        music3.currentTime = 0;
    });

    // ===== MARKER 4 =====
    marker4.addEventListener('markerFound', () => {
        music4.volume = 0;
        music4.currentTime = 0;
        music4.play();
    });

    marker4.addEventListener('markerLost', () => {
        music4.pause();
        music4.currentTime = 0;
    });

    // ===== MARKER 5 =====
    marker5.addEventListener('markerFound', () => {
        music5.volume = 0;
        music5.currentTime = 0;
        music5.play();
    });

    marker5.addEventListener('markerLost', () => {
        music5.pause();
        music5.currentTime = 0;
    });

});
</script>

</body>
</html>
