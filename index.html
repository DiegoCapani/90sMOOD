<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEMORY90</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; background-color: #000; }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }

        #splash-screen::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 4px, 6px 100%; pointer-events: none;
        }

        .title-container { text-align: center; margin-bottom: 50px; transform: skewX(-10deg); z-index: 3;}
        .title-main { font-size: 48px; font-weight: 900; color: #00ffff; text-transform: uppercase; letter-spacing: 4px; text-shadow: 3px 3px 0px #ff00ff, 6px 6px 0px #000000; margin: 0; }
        .title-sub { font-size: 18px; color: #ffff00; text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; text-shadow: 2px 2px 0px #ff0000; }

        #start-btn { 
            padding: 15px 40px; font-size: 22px; font-family: monospace; font-weight: bold;
            color: #ffffff; background: #00ff00; border: 4px solid #ffffff; 
            box-shadow: 5px 5px 0px #ff00ff; cursor: pointer; text-transform: uppercase; z-index: 3;
            outline: none;
        }
        #start-btn:active { box-shadow: 1px 1px 0px #ff00ff; transform: translate(4px, 4px); }

        .loading-text {
            color: #ffffff; margin-top: 30px; font-size: 14px; letter-spacing: 2px;
            animation: blink 1s infinite; z-index: 3;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        /* La scena è presente nel DOM ma inizialmente invisibile */
        #ar-scene-wrapper { opacity: 0; transition: opacity 0.5s ease; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="title-container">
            <h1 class="title-main">MEMORY90</h1>
            <div class="title-sub">by Diego Capani</div>
        </div>
        <button id="start-btn">REMEMBER</button>
        <div class="loading-text">INSERT COIN TO PLAY...</div>
    </div>

    <div id="ar-scene-wrapper">
        <a-scene
            embedded
            vr-mode-ui="enabled: false"
            renderer="logarithmicDepthBuffer: true; alpha: true; antialias: true; colorManagement: true;"
            arjs="sourceType: webcam; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

            <a-assets>
                <a-asset-item id="modello-1" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-2" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-3" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-4" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-5" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-6" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-7" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-8" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-9" src="assets/nokia8.glb"></a-asset-item>
                <a-asset-item id="modello-10" src="assets/nokia8.glb"></a-asset-item>
            </a-assets>

            <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
            <a-entity light="type: directional; intensity: 0.6;" position="1 2 1"></a-entity>

            <a-marker type="barcode" value="1"><a-entity gltf-model="#modello-1" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="2"><a-entity gltf-model="#modello-2" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="3"><a-entity gltf-model="#modello-3" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="4"><a-entity gltf-model="#modello-4" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="5"><a-entity gltf-model="#modello-5" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="6"><a-entity gltf-model="#modello-6" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="7"><a-entity gltf-model="#modello-7" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="8"><a-entity gltf-model="#modello-8" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="9"><a-entity gltf-model="#modello-9" scale="0.5 0.5 0.5"></a-entity></a-marker>
            <a-marker type="barcode" value="10"><a-entity gltf-model="#modello-10" scale="0.5 0.5 0.5"></a-entity></a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <script>
        document.getElementById('start-btn').addEventListener('click', async function() {
            try {
                // Richiesta permessi
                await navigator.mediaDevices.getUserMedia({ video: true });
                
                // Nascondi splash
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 500);

                // Mostra la scena
                document.getElementById('ar-scene-wrapper').style.opacity = '1';
            } catch (err) {
                alert("Errore fotocamera: Consenti i permessi nelle impostazioni del browser.");
            }
        });
    </script>
</body>
</html>
