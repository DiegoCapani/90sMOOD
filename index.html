<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR WebApp Marker 1</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: black;
    }

    a-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-family: sans-serif;
      font-size: 14px;
      background: rgba(0,0,0,0.4);
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="overlay">AR attivo - Marker 1</div>

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; colorManagement: true; precision: medium;"
>

  <a-assets>
    <!-- Tutti i modelli devono stare qui dentro assets/ -->
    <a-asset-item id="model1" src="assets/model.glb"></a-asset-item>
  </a-assets>

  <!-- LUCE -->
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" intensity="0.6" position="1 2 1"></a-light>

  <!-- MARKER 1 (barcode AR.js) -->
  <a-marker type="barcode" value="1">
    <a-entity
      gltf-model="#model1"
      scale="0.5 0.5 0.5"
      position="0 0 0"
      rotation="0 180 0"
    ></a-entity>
  </a-marker>

  <!-- CAMERA -->
  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
