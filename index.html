<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEMORY90</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }

        #splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 22px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="splash-screen">
    <h1 style="color:#00ffff;">CYBER AR</h1>
    <button id="start-btn">START APP</button>
</div>

<a-scene embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

    <a-assets>
        <a-asset-item id="modello-1" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-2" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-3" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-4" src="assets/nokia8.glb"></a-asset-item>
    </a-assets>

    <a-marker type="barcode" value="1" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity gltf-model="#modello-1" scale="3 3 3" rotation="0 90 0"></a-entity>
    </a-marker>

    <a-marker type="barcode" value="2" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity gltf-model="#modello-2" scale="3 3 3" rotation="0 90 0"></a-entity>
    </a-marker>

    <a-marker type="barcode" value="3" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity gltf-model="#modello-3" scale="3 3 3" rotation="0 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        </a-entity>
    </a-marker>

    <a-marker type="barcode" value="4" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity gltf-model="#modello-4" scale="0.01 0.01 0.01" rotation="-90 0 0"></a-entity>

        <a-plane rotation="-90 0 0" width="8" height="8" position="0 0 0"
            material="src: assets/ombra.png; transparent: true; opacity: 0.6">
        </a-plane>
    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>
    document.getElementById('start-btn').addEventListener('click', async () => {
        const splash = document.getElementById('splash-screen');
        const scene = document.querySelector('a-scene');

        // avvia AR context
        if (scene) scene.play();

        splash.style.opacity = '0';

        setTimeout(() => {
            splash.style.display = 'none';
        }, 400);
    });
</script>

</body>
</html>
