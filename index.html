<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>90s MEMORY AR</title>

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- ARJS -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- STYLE -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">

    <div class="crt"></div>

    <div class="splash-content">

      <h1>90s MEMORY AR</h1>

      <p class="subtitle">
        urban archive // 1990-1999
      </p>

      <button id="enter-btn">
        ENTER
      </button>

    </div>

  </div>

  <!-- UI OVERLAY -->
  <div id="overlay">

    <div class="top-bar">
      OBJECT 08/10 — NOKIA 3310
    </div>

    <div class="bottom-bar">
      Point camera at barcode marker #4
    </div>

  </div>

  <!-- AR SCENE -->
  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      logarithmicDepthBuffer: true;
      antialias: true;
      alpha: true;
    "

    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
  >

    <!-- LIGHT -->
    <a-light
      type="ambient"
      intensity="1.4">
    </a-light>

    <!-- MARKER 4 -->
    <a-marker
      type="barcode"
      value="4"
    >

      <!-- MODEL -->
      <a-entity

        gltf-model="assets/nokia8.glb"

        position="0 0.02 0"

        rotation="-90 12 4"

        scale="0.35 0.35 0.35"

      >
      </a-entity>

      <!-- SHADOW -->
      <a-circle

        position="0 0.01 0"

        rotation="-90 0 0"

        radius="0.45"

        color="#000000"

        opacity="0.22"

      >
      </a-circle>

    </a-marker>

    <!-- CAMERA -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- APP -->
  <script src="app.js"></script>

</body>
</html>
