<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEMORY90</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        /* Effetto CRT e Stile mantenuti */
        #splash-screen::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 4px, 6px 100%; pointer-events: none;
        }
        .title-container { text-align: center; margin-bottom: 50px; transform: skewX(-10deg); z-index: 3; }
        .title-main { font-size: 48px; color: #00ffff; text-transform: uppercase; text-shadow: 3px 3px #ff00ff; margin: 0; }
        #start-btn { padding: 15px 40px; font-size: 22px; background: #00ff00; border: 4px solid #fff; cursor: pointer; z-index: 3; }
        .loading-text { color: #fff; margin-top: 30px; animation: blink 1s infinite; z-index: 3; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="title-container">
            <h1 class="title-main">MEMORY90</h1>
        </div>
        <button id="start-btn">REMEMBER</button>
        <div class="loading-text">INSERT COIN TO PLAY...</div>
    </div>

    <div id="scene-container"></div>

    <script>
        document.getElementById('start-btn').addEventListener('click', async function() {
            try {
                // 1. Chiedi permessi
                await navigator.mediaDevices.getUserMedia({ video: true });
                
                // 2. Nascondi Splash
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 500);

                // 3. Inserisci la A-Scene dinamicamente per forzare l'attivazione della camera
                document.getElementById('scene-container').innerHTML = `
                <a-scene embedded vr-mode-ui="enabled: false" 
                         arjs="sourceType: webcam; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">
                    <a-assets>
                        <a-asset-item id="modello-1" src="assets/modello1.glb"></a-asset-item>
                        <a-asset-item id="modello-2" src="assets/modello2.glb"></a-asset-item>
                        <a-asset-item id="modello-3" src="assets/modello3.glb"></a-asset-item>
                        <a-asset-item id="modello-4" src="assets/modello4.glb"></a-asset-item>
                        <a-asset-item id="modello-5" src="assets/modello5.glb"></a-asset-item>
                        <a-asset-item id="modello-6" src="assets/modello6.glb"></a-asset-item>
                        <a-asset-item id="modello-7" src="assets/modello7.glb"></a-asset-item>
                        <a-asset-item id="modello-8" src="assets/nokia8.glb"></a-asset-item>
                        <a-asset-item id="modello-9" src="assets/modello9.glb"></a-asset-item>
                        <a-asset-item id="modello-10" src="assets/modello10.glb"></a-asset-item>
                    </a-assets>

                    <a-marker type="barcode" value="1"><a-entity gltf-model="#modello-1" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="2"><a-entity gltf-model="#modello-2" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="3"><a-entity gltf-model="#modello-3" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="4"><a-entity gltf-model="#modello-4" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="5"><a-entity gltf-model="#modello-5" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="6"><a-entity gltf-model="#modello-6" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="7"><a-entity gltf-model="#modello-7" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="8"><a-entity gltf-model="#modello-8" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="9"><a-entity gltf-model="#modello-9" scale="0.5 0.5 0.5"></a-entity></a-marker>
                    <a-marker type="barcode" value="10"><a-entity gltf-model="#modello-10" scale="0.5 0.5 0.5"></a-entity></a-marker>

                    <a-entity camera></a-entity>
                </a-scene>`;
            } catch (err) {
                alert("Errore fotocamera: Verifica i permessi nelle impostazioni del browser.");
            }
        });
    </script>
</body>
</html>
