<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEMEORY by Diego Capani</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true;"
>

    <a-assets>
        <a-asset-item id="modello-1" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-2" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-3" src="assets/nokia8.glb"></a-asset-item>
        <a-asset-item id="modello-4" src="assets/nokia8.glb"></a-asset-item>
    </a-assets>

    <!-- MARKER 1 -->
    <a-marker type="barcode" value="1">
        <a-entity
            gltf-model="#modello-1"
            scale="0.8 0.8 0.8"
            position="0 0 0"
            rotation="0 90 0">
        </a-entity>
    </a-marker>

    <!-- MARKER 2 -->
    <a-marker type="barcode" value="2">
        <a-entity
            gltf-model="#modello-2"
            scale="0.8 0.8 0.8"
            position="0 0 0"
            rotation="0 90 0">
        </a-entity>
    </a-marker>

    <!-- MARKER 3 -->
    <a-marker type="barcode" value="3">
        <a-entity
            gltf-model="#modello-3"
            scale="0.8 0.8 0.8"
            position="0 0 0"
            rotation="0 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
        </a-entity>
    </a-marker>

    <!-- MARKER 4 -->
    <a-marker type="barcode" value="4">
        <a-entity
            gltf-model="#modello-4"
            scale="0.5 0.5 0.5"
            position="0 0 0"
            rotation="0 90 0">
        </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
